<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ✅ Primary Meta Tags -->
    <title>
      Voice Calculator | Glassmorphism Smart Calculator with Hindi Voice
    </title>

    <meta
      name="title"
      content="Voice Calculator | Glassmorphism Smart Calculator"
    />
    <meta
      name="description"
      content="A smart glassmorphism voice calculator with Hindi & English voice support, algebraic equation solver, history storage, and modern UI. Built using JavaScript and math.js."
    />

    <meta
      name="keywords"
      content="
voice calculator,
speech recognition calculator,
hindi voice calculator,
glassmorphism calculator,
algebra equation solver,
javascript calculator,
math.js calculator,
ai calculator project
"
    />

    <meta name="author" content="Kunal Gupta" />
    <meta name="robots" content="index, follow" />

    
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Voice Calculator with Algebra Solver" />
    <meta
      property="og:description"
      content="Glassmorphism voice-enabled calculator with Hindi support, algebra solving, and persistent history. Built using JavaScript & math.js."
    />
    <meta property="og:url" content="https://voicecalc.vercel.app/" />
    <meta
      property="og:image"
      content="https://voicecalc.vercel.app/preview.png"
    />

    
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Smart Voice Calculator" />
    <meta
      name="twitter:description"
      content="Modern voice calculator with Hindi input, algebra solver, and glass UI."
    />
    <meta
      name="twitter:image"
      content="https://voicecalc.vercel.app/preview.png"
    />

    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="calc.css" />
    <script src="https://unpkg.com/mathjs@15.0.0/lib/browser/math.js"></script>
  </head>

  <body
    class="bg-gradient-to-br from-gray-900 via-gray-800 to-black flex justify-center items-center min-h-screen text-white"
  >
    <div class="flex flex-col md:flex-row gap-6">
      <div
        class="backdrop-blur-xl bg-white/10 border border-white/20 shadow-2xl p-6 rounded-3xl w-80 relative"
      >
        <input
          id="display"
          disabled
          class="w-full bg-white/20 backdrop-blur-lg text-white text-right text-3xl p-4 rounded-xl mb-4 outline-none shadow-inner"
        />

        <div class="grid grid-cols-4 gap-3">
          <button
            class="bg-red-500/80 hover:bg-red-600 text-white py-3 rounded-xl text-lg"
            onclick="clearDisplay()"
          >
            C
          </button>

          <button
            class="bg-yellow-500/80 hover:bg-yellow-600 text-white py-3 rounded-xl text-lg"
            onclick="delChar()"
          >
            ⌫
          </button>

          <button
            class="bg-blue-500/70 hover:bg-blue-600 text-white py-3 rounded-xl text-lg"
            onclick="press('%')"
          >
            %
          </button>

          <button
            class="bg-purple-500/80 hover:bg-purple-600 text-white py-3 rounded-xl text-lg"
            onclick="press('/')"
          >
            ÷
          </button>

          <button
            class="bg-white/10 hover:bg-white/20 py-3 rounded-xl"
            onclick="press('7')"
          >
            7
          </button>
          <button
            class="bg-white/10 hover:bg-white/20 py-3 rounded-xl"
            onclick="press('8')"
          >
            8
          </button>
          <button
            class="bg-white/10 hover:bg-white/20 py-3 rounded-xl"
            onclick="press('9')"
          >
            9
          </button>
          <button
            class="bg-blue-500/70 hover:bg-blue-600 text-white py-3 rounded-xl text-lg"
            onclick="press('*')"
          >
            ×
          </button>

          <button
            class="bg-white/10 hover:bg-white/20 py-3 rounded-xl"
            onclick="press('4')"
          >
            4
          </button>
          <button
            class="bg-white/10 hover:bg-white/20 py-3 rounded-xl"
            onclick="press('5')"
          >
            5
          </button>
          <button
            class="bg-white/10 hover:bg-white/20 py-3 rounded-xl"
            onclick="press('6')"
          >
            6
          </button>
          <button
            class="bg-blue-500/70 hover:bg-blue-600 text-white py-3 rounded-xl text-lg"
            onclick="press('-')"
          >
            −
          </button>

          <button
            class="bg-white/10 hover:bg-white/20 py-3 rounded-xl"
            onclick="press('1')"
          >
            1
          </button>
          <button
            class="bg-white/10 hover:bg-white/20 py-3 rounded-xl"
            onclick="press('2')"
          >
            2
          </button>
          <button
            class="bg-white/10 hover:bg-white/20 py-3 rounded-xl"
            onclick="press('3')"
          >
            3
          </button>
          <button
            class="bg-blue-500/70 hover:bg-blue-600 text-white py-3 rounded-xl text-lg"
            onclick="press('+')"
          >
            +
          </button>

          <button
            class="bg-white/10 hover:bg-white/20 py-3 rounded-xl"
            onclick="press('0')"
          >
            0
          </button>
          <button
            class="bg-white/10 hover:bg-white/20 py-3 rounded-xl"
            onclick="press('.')"
          >
            .
          </button>
          <button
            class="bg-white/10 hover:bg-white/20 py-3 rounded-xl"
            onclick="press('(')"
          >
            (
          </button>
          <button
            class="bg-white/10 hover:bg-white/20 py-3 rounded-xl"
            onclick="press(')')"
          >
            )
          </button>

          <button
            class="bg-white/10 hover:bg-white/20 py-3 rounded-xl col-span-2"
            onclick="press('^')"
          >
            ^
          </button>
          <button
            class="bg-green-500/80 hover:bg-green-600 text-white py-3 rounded-xl text-xl col-span-2"
            onclick="calculate()"
          >
            =
          </button>
        </div>

        <div class="mt-5 flex justify-between items-center">
          <button
            onclick="toggleHistory()"
            class="bg-white/20 hover:bg-white/30 text-sm px-3 py-2 rounded-xl flex items-center gap-1"
          >
            📜 History
          </button>

          <button
            id="micBtn"
            onclick="startListening()"
            class="bg-red-500 hover:bg-red-600 p-4 rounded-full text-white text-2xl shadow-lg"
          >
            🎤
          </button>
        </div>
      </div>

      <div
        id="historyWrapper"
        class="w-72 bg-white/10 backdrop-blur-lg rounded-2xl p-3 shadow-xl transform translate-x-full opacity-0 md:translate-x-0 md:opacity-100 transition-all duration-300 fixed right-4 top-4 md:static"
      >
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-lg font-semibold">History</h2>
          <button
            onclick="clearHistory()"
            class="text-xs text-red-300 hover:text-red-400"
          >
            Clear
          </button>
        </div>

        <ul
          id="historyPanel"
          class="space-y-2 max-h-64 overflow-y-auto text-sm"
        ></ul>
      </div>
    </div>

    <script src="calc.js"></script>
  </body>
</html>
